# Only the checks a bump must pass live here; the called workflow does the rest.
name: Dependency upgrades

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: deps-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    uses: yaniv120892/claude-config/.github/workflows/deps-upgrade.yml@main
    secrets: inherit
    with:
      check_commands: |
        npm run lint
        npm run build
        npm run test:unit
